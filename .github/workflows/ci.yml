name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # The GuardPolicy schema is the public contract: people's editors validate
  # against the committed JSON Schema, while the runtime validates against the
  # zod object it is generated from. If those two ever disagree, a policy that
  # looks valid while being typed gets rejected at startup — a bad experience
  # for any tool, and a dangerous one for the file that says what gets blocked.
  #
  # Pinned to Node 24 because the generator is a `.mts` file run through Node's
  # native type stripping.
  schema-drift:
    name: schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run schema:check

# The detection and latency benchmarks arrive in phase 10 and will live in their
# own workflow: a red benchmark means something different from a red test, and
# the two should not be read off one badge.
